services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8091
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:3000:3000"

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8091
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:3001:3000"
