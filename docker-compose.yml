services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crescentlab
      POSTGRES_USER: crescentlab
      POSTGRES_PASSWORD: crescentlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crescentlab -d crescentlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    volumes:
      - ./default_files/conf.postgres.ini:/app/data/conf.ini:ro

  frontend:
    build:
      context: .
      target: frontend
      args:
        BACKEND_URL: http://backend:8091
    environment:
      BACKEND_URL: http://backend:8091
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
