services:
  backend:
    build:
      context: .
      target: backend
      args:
        GO_IMAGE: ${GO_IMAGE:-m.daocloud.io/docker.io/library/golang:1.26-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-m.daocloud.io/docker.io/library/alpine:3.22}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    volumes:
      - ./data/conf.ini:/app/data/conf.ini:ro
      - project_artifacts:/app/data/project-artifacts
      - storage_keys:/app/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: .
      target: frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        BACKEND_URL: http://backend:8091
        ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
    environment:
      BACKEND_URL: http://backend:8091
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      target: admin
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        BACKEND_URL: http://backend:8091
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      BACKEND_URL: http://backend:8091
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  project_artifacts:
  storage_keys:
